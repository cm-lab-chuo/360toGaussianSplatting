; ============================================================================
;  360Gaussian Pipeline 設定ファイル
; ----------------------------------------------------------------------------
;  ・行頭または行末の ;  以降はコメント（無視される）
;  ・パスは \ でも / でも可。空欄にすると「未設定」扱い
;  ・このファイルを config/myexp.ini 等に複製し、--config で切替も可能
;  ・各キーは実行時に --set Section.key=value で上書きできる
;    例: --set VideoSettings.splits=12
; ============================================================================


; ===== SfM (RealityScan) / Postshot 用の外部ツールパス =====================
; ※ Postshot は今回のパイプライン範囲外（3DGSトレーニング用）。記載のみ。
[PostShotPaths]
; RealityScan(RealityCapture) 本体。--sfm realitycapture で使用。
realitycapturepath = C:\Program Files\Epic Games\RealityScan_2.1\RealityScan.exe
; Postshot CLI（パイプライン範囲外）
postshotpath = C:\Program Files\Jawset Postshot\bin\postshot-cli.exe
; RealityScan のエクスポート設定XML置き場（3DGS_reg.xml / 3DGS_ply.xml）
settingsfolder = C:\path\to\RC_Settings


; ===== 動画→フレーム抽出 / 透視投影分割の設定 =============================
[VideoSettings]
fps = 1                       ; 抽出レート。seconds モードでは「1秒に何枚」
frame_extraction_mode = seconds ; seconds=時間間隔 / frames=Nフレームごと
splits = 8                    ; 1フレームを何方向の透視画像に分割するか
resolution = 1920             ; 基準解像度
resolutionwidth = 1920        ; 出力画像の幅(px)
resolutionheight = 1920       ; 出力画像の高さ(px)
fovvalue = 90                 ; 各透視画像の画角(度)。小さいほど望遠・枚数の重なり増
processingmode = hybrid       ; hybrid / equirect / cubemap
usegpu = True                 ; GPU利用(対応ツール時)
useframefilter = False        ; ブレ画像フィルタを使うか（下の FrameFilter 設定参照）
filtermethod = best_n         ; best_n=上位を残す / threshold=閾値以上を残す
framestokeep = 50%            ; best_n時に残す割合(%) または枚数
sharpnessthreshold = 100.0    ; threshold時のシャープネス下限(Laplacian分散)
usemultitilt = False          ; 上下チルト視点も追加するか
tiltangle2 = 30               ; 追加チルト角1(度)
tiltangle3 = -30              ; 追加チルト角2(度)
autocontinue = True           ; 確認なしで次工程へ


; ===== Postshot トレーナー設定（パイプライン範囲外・記載のみ）=============
[PostShotSettings]
profile = Splat MCMC
maximagesize = 0
trainsteps = 25
maxsplats = 3000
showtrainerror = True
antialiasing = False
exportply = True


; ===== AutoMasker（GroundingDINO + SAM2）の実行ファイル・モデルパス ========
; --masker automasker で使用。下記はすべて実在を確認済み。
[AutoMaskerPaths]
automaskerpath = F:/GaussianSplatting/AutoMasker/AutoMasker-1.3.1/AutoMasker.exe
configfile =
dinoconfig = F:/GaussianSplatting/AutoMasker/AutoMasker-1.3.1/Models/GroundingDINO_SwinT_OGC.py
dinocheckpoint = F:/GaussianSplatting/AutoMasker/AutoMasker-1.3.1/Models/groundingdino_swint_ogc.pth
samconfig = F:/GaussianSplatting/AutoMasker/AutoMasker-1.3.1/Models/sam2_hiera_l.yaml
samcheckpoint = F:/GaussianSplatting/AutoMasker/AutoMasker-1.3.1/Models/sam2_hiera_large.pt


; ===== AutoMasker の挙動設定 ==============================================
[AutoMaskerSettings]
useautomasker = True
keywords = person.sky         ; 除外したい対象。ドット区切り 例: person.sky.car
boxthreshold = 0.35           ; GroundingDINO の検出ボックス信頼度
textthreshold = 0.25          ; テキストとの対応付け閾値
exportmaskonly = True
exporttransparent = True
exportcolored = False
invertmask = True             ; True=検出物を「除外」(背景を残す)
pregenerated_masks_path =     ; --masker pregenerated 時の既存マスクフォルダ
maskexpand = 5.0              ; マスク領域を何px膨張させるか
custom_mask_only = False
custom_mask_path =


; ===== マスクのSfMへの適用設定 ===========================================
; マスクの「生成」は --masker（automasker等）や外部プログラムが担当。
; ここはそのマスクをSfM(COLMAP)に「適用」する方法の設定。
; COLMAP は黒(0)画素を特徴抽出から除外する。除外したい物体（人・空等）が
; 黒になるようにする。出所を問わず同じ経路で適用される。
[MaskSettings]
apply_masks_to_sfm = True     ; マスクをSfMに渡すか
external_mask_dir =           ; 別プログラムで作ったマスクのフォルダ（指定時はこちら優先）
mask_invert = True            ; AutoMaskerは除外領域を白で出力する。COLMAPは黒を無視するため
                              ; 反転が必要（True）。別ツールのマスクで極性が逆なら False に。
mask_suffixes = .mask,_mask,_masked ; マスクファイル名のサフィックス候補（例 <名前>.mask.png）
mask_threshold = 127          ; マスク2値化のしきい値(0-255)


; ===== 外部実行ファイルのパス =============================================
; 空欄にすると PATH から解決する。フルパス指定も可。
[ToolPaths]
ffmpeg =                      ; フレーム抽出に使用。空欄=PATHのffmpeg
colmap_sphere = F:/360Gaussian-1.4.3/_internal/bin/colmap_sphere.exe ; --sfm spheresfm で使用。空欄=PATHのcolmap_sphere.exe


; ===== 標準COLMAP のパス ===================================================
; --sfm colmap で使用。空欄なら PATH 上の colmap を探す。
[COLMAPPaths]
colmappath =                  ; 例: C:\path\to\colmap.exe


; ===== アライメント全般・マーカー設定 ======================================
[AlignmentSettings]
usemarkers = False            ; AprilTag等のマーカーで実スケール合わせをするか
markerdistance = 0.5          ; マーカー間の実距離(m)
training_method = no_training ; 
alignment_method_brush = realityscan
alignment_method_postshot = postshot
alignment_method_no_training = spheresfm
alignment_method_lichtfeld = spheresfm
export_stability_wait_time = 3.0
max_export_stability_checks = 10
graceful_termination_timeout = 10.0
markertype = 1x12             ; 1x12 / 16h5


; ===== Brush トレーナー設定（パイプライン範囲外・記載のみ）================
[BrushSettings]
brush_path =
total_steps = 25
max_splats = 3000
sh_degree = 3
max_resolution = 1920
export_every = 5000


; ===== Lichtfeld トレーナー設定（パイプライン範囲外・記載のみ）============
[LichtfeldSettings]
lichtfeld_path =
iter = 30
sh_degree = 3
max_width = 3840
strategy = mrnf
max_cap = 3000
steps_scaler = 1.0


; ===== SphereSFM (colmap_sphere) の詳細パラメータ ==========================
; --sfm spheresfm（デフォルト）で使用。実行ファイルは [ToolPaths] colmap_sphere で指定。
; 値は COLMAP の各オプションにそのまま渡される。
[SphereSFMSettings]
max_num_features = 32768      ; 1画像あたりの特徴点上限
first_octave = 0
peak_threshold = 0.004        ; SIFT検出のピーク閾値（小さいほど多く検出）
edge_threshold = 12.0
max_num_matches = 65536
matcher_type = sequential     ; sequential=動画向き / exhaustive=全組合せ(低速・高精度)
estimate_affine_shape = True
domain_size_pooling = True
guided_matching = False
ba_local_max_iterations = 40  ; ローカルBundle Adjustmentの反復上限
ba_global_max_iterations = 100 ; グローバルBAの反復上限
ba_global_max_refinements = 2
filter_max_reproj_error = 2.5 ; この再投影誤差(px)超の点を除外
filter_min_tri_angle = 1.75   ; 三角測量の最小角(度)
abs_pose_min_num_inliers = 50
run_bundle_adjuster = True
realign_cubemaps = True       ; 同一フレーム由来の分割画像を幾何拘束する(360°向け)
cubemap_refine_focal = False
